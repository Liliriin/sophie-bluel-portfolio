<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Sophie Bluel</title>
    <link rel="stylesheet" href="./assets/style.css">
    <link rel="stylesheet" href="./assets/admin.css">
    <script src="https://kit.fontawesome.com/181bdd94dd.js" crossorigin="anonymous"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Work+Sans&display=swap" rel="stylesheet">
    
</head>

<body>

    <!-- Barre noire mode édition -->
    <div class="edit-bar">
        <p><i class="fa-regular fa-pen-to-square"></i> Mode édition</p>
    </div>

    <header>
        <h1>Sophie Bluel <span>Architecte d'intérieur</span></h1>
        <nav>
            <ul>
			<li>projets</li>
			<li>contact</li>
			<li>logout</li>
			<li><img src="./assets/icons/instagram.png" alt="Instagram"></li>
		</ul>
            
        </nav>
    </header>

    <main>

        <section class="admin-header">
            <h2>Mes projets</h2>
            <button id="open-modal-btn" class="edit-btn">
                <i class="fa-regular fa-pen-to-square"></i> modifier
            </button>
        </section>

        <section id="gallery-admin" class="gallery-admin"></section>
        

    </main>
<aside id="modal" class="modal hidden">
        <div class="modal-content">
            <span id="close-modal-btn" class="close-btn">&times;</span>

            <h3>Galerie photo</h3>

            <div id="modal-gallery" class="modal-gallery"></div>

            <hr>

            <button id="add-photo-btn" class="modal-btn">Ajouter une photo</button>

            <!-- Formulaire d’ajout -->
            <form id="add-photoform" class="hidden">
                <label>Image</label>
                <input type="file" id="image-input" accept="image/*">

                <label>Titre</label>
                <input type="text" id="title-input">

                <label>Catégorie</label>
                <select id="category-input"></select>

                <button type="submit" class="modal-btn">Valider</button>
            </form>
        </div>
    </aside>
 

    
    <script src="admin.js"></script>
</body>
</html>
